name: CodeQL Full

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-javascript:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          packs: codeql/javascript-queries:AlertSuppression.ql

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: .github/workflows/codeql.yml:analyze
          output: sarif-results

      - name: Apply source suppressions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node .github/scripts/apply-codeql-suppressions.mjs "${{ steps.analyze.outputs.sarif-output }}"
        env:
          SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}

  analyze-swift:
    name: Analyze (Swift)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
          packs: codeql/swift-queries:AlertSuppression.ql

      - name: Build Swift package
        run: swift build --package-path apps/macos/ModelRouterTray

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
          output: sarif-results

      - name: Apply source suppressions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node .github/scripts/apply-codeql-suppressions.mjs "${{ steps.analyze.outputs.sarif-output }}"
        env:
          SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
