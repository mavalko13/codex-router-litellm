name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,codeql/javascript-queries:AlertSuppression.ql

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results

      - name: Apply source suppressions
        if: github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: ${{ steps.analyze.outputs.sarif-output }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  analyze-swift:
    name: Analyze (Swift)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended,codeql/swift-queries:AlertSuppression.ql

      - name: Build Swift package
        run: swift build --package-path apps/macos/ModelRouterTray

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
          output: sarif-results

      - name: Apply source suppressions
        if: github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: ${{ steps.analyze.outputs.sarif-output }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
