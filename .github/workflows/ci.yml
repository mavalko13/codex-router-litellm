name: CI

"on":
  pull_request:
    branches: [beta, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The full, cross-platform verification gate is intentionally local. GitHub
# Actions remains a short Windows integration signal for the install and
# background-service path that cannot be exercised on the macOS development
# host. Run `npm run verify:local` before opening a beta PR.
jobs:
  test:
    name: test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run Windows service and installer regressions
        run: node --test test/service-render.test.mjs test/windows-process-tree.test.mjs test/installer-scripts.test.mjs test/installer-handoff.test.mjs
      - name: Parse PowerShell entrypoints
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "codex-router.ps1", "model-router.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
